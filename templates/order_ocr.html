<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문지 OCR | 약국 업무 자동화</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="/static/css/main.css" rel="stylesheet">
    <link href="/static/css/home.css" rel="stylesheet">
    <link href="/static/css/order-ocr.css" rel="stylesheet">

    <!-- 깜빡임 방지: 저장된 테마를 즉시 적용 -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
        <div class="nav-content">
            <div class="nav-brand">
                <a href="/" class="nav-back" title="홈으로"><i class="bi bi-arrow-left"></i></a>
                <i class="bi bi-file-earmark-text"></i>
                <span>주문지 OCR</span>
            </div>
            <div class="nav-controls">
                <a href="/drug-master" class="theme-toggle" title="약품 마스터 관리" style="text-decoration:none;">
                    <i class="bi bi-database"></i>
                </a>
                <button id="themeToggle" class="theme-toggle" title="다크모드 전환">
                    <i class="bi bi-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <main class="main-container ocr-container">
        <section class="home-header">
            <h1>손글씨 주문지 OCR</h1>
            <p class="subtitle">주문지 사진을 올리면 약품명·포장단위·수량을 자동으로 읽어옵니다</p>
        </section>

        <!-- 1) 업로드 영역 -->
        <section class="ocr-card">
            <div id="dropZone" class="drop-zone">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <img id="previewImg" class="preview-img" hidden alt="업로드한 주문지 미리보기">
                <div id="dropPrompt" class="drop-prompt">
                    <i class="bi bi-cloud-arrow-up"></i>
                    <p><strong>이미지를 끌어다 놓거나 클릭해서 선택</strong></p>
                    <p class="hint">JPG · PNG · WEBP · HEIC (최대 15MB)</p>
                </div>
            </div>
            <div class="ocr-actions">
                <button id="clearBtn" class="btn btn-ghost" hidden>
                    <i class="bi bi-x-lg"></i> 다른 이미지
                </button>
                <button id="extractBtn" class="btn btn-primary" disabled>
                    <i class="bi bi-magic"></i> 글자 읽기
                </button>
            </div>
            <div id="statusMsg" class="status-msg" hidden></div>
        </section>

        <!-- 2) 검수 영역 -->
        <section id="reviewSection" class="ocr-card" hidden>
            <div class="review-header">
                <h2><i class="bi bi-pencil-square"></i> 검수 &amp; 수정</h2>
                <p class="hint">읽어온 내용을 확인하고 잘못된 부분을 직접 고쳐주세요.</p>
            </div>

            <!-- 주문 컨텍스트(날짜 / 차수) -->
            <div class="order-meta">
                <label>
                    <span>주문 날짜</span>
                    <input type="date" id="orderDate">
                </label>
                <label>
                    <span>주문 차수</span>
                    <select id="orderRound">
                        <option value="1">1차</option>
                        <option value="2">2차</option>
                        <option value="3">3차</option>
                    </select>
                </label>
            </div>

            <div class="table-wrap">
                <table class="review-table">
                    <thead>
                        <tr>
                            <th class="col-idx">#</th>
                            <th>약품명</th>
                            <th class="col-unit">포장단위</th>
                            <th class="col-qty">수량</th>
                            <th class="col-del"></th>
                        </tr>
                    </thead>
                    <tbody id="reviewBody"></tbody>
                </table>
            </div>

            <div class="review-footer">
                <button id="addRowBtn" class="btn btn-ghost">
                    <i class="bi bi-plus-lg"></i> 행 추가
                </button>
                <button id="saveBtn" class="btn btn-primary" disabled
                        title="저장 기능은 다음 단계(Supabase 연동)에서 추가됩니다">
                    <i class="bi bi-save"></i> 저장 (다음 단계)
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <span>© 약품재고체커 by ChaJM</span>
        </div>
    </footer>

    <script src="/static/js/order-ocr.js"></script>
</body>
</html>
